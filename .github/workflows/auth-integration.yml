name: API auth integration (temporary PostgreSQL)
on:
  push:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/auth-integration.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/auth-integration.yml'
permissions:
  contents: read
jobs:
  api-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uorqui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uorqui_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uorqui_test
      AUTH_SECRET: test-only-secret-1234567890-abcdefghijklmnopqrstuvwxyz
      DM_ATTACHMENT_PROOF_SECRET: temporary-ci-signature-key-only-1234567890-abcdefghijklmnopqrstuvwxyz
      AUTH_BASE_URL: http://127.0.0.1:3001
      WEB_ORIGIN: http://localhost:5173
      ENABLE_DEV_SIGNUP: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply Drizzle migrations to ephemeral PostgreSQL
        run: npm run db:migrate
      - name: Build API
        run: npm run build -w @uorqui/api
      - name: Exercise authentication and onboarding
        run: node --test apps/api/test/auth.integration.test.mjs
      - name: Exercise real direct messages between two users
        run: node --test apps/api/test/direct-messages.integration.test.mjs
      - name: Exercise real community membership and messages
        run: node --test apps/api/test/communities.integration.test.mjs
      - name: Exercise persistent hybrid feed and signed media permissions
        run: node --test apps/api/test/feed.integration.test.mjs
      - name: Verify authenticated community voice signaling
        run: node --test apps/api/test/community-voice.integration.test.mjs
      - name: Verify disabled registration is enforced server-side
        run: node --test apps/api/test/signup-closed.integration.test.mjs
      - name: Verify production does not enable signup from dev flags
        run: node --test apps/api/test/production-locked.integration.test.mjs
      - name: Build Cloudflare Worker frontend for isolated proxy test
        run: npm run build -w @uorqui/web
      - name: Test Worker to Fastify to PostgreSQL cookies and API routing
        run: node --test apps/api/test/worker-proxy.integration.test.mjs
