name: Code checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate Cloudflare Worker bundle without deploying
        run: npm run check:worker -w @uorqui/web
      - name: Check Drizzle migration files for schema drift
        shell: bash
        run: |
          npm run db:generate
          if [[ -n "$(git status --porcelain -- apps/api/drizzle)" ]]; then
            echo 'Drizzle schema changed without committed migration artifacts' >&2
            git status --short -- apps/api/drizzle
            exit 1
          fi
