name: API checks
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - ".github/workflows/ci.yml"
jobs:
  api-build-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck -w @uorqui/api
      - name: Build API
        run: npm run build -w @uorqui/api
      - name: Test Resend provider diagnostics without external email
        run: node --test apps/api/test/email-provider.test.mjs
      - name: Check Drizzle migration files for schema drift
        shell: bash
        run: |
          npm run db:generate
          for generated in apps/api/drizzle/0008_*.sql; do
            if [[ -f "$generated" ]]; then cat "$generated"; fi
          done
          node -e 'const fs=require("fs");const p="apps/api/drizzle/meta/0008_snapshot.json";if(fs.existsSync(p)){const x=JSON.parse(fs.readFileSync(p));console.log("GENERATED_SNAPSHOT_ATTACHMENT_COLUMNS",JSON.stringify(Object.fromEntries(Object.entries(x.tables["public.direct_messages"].columns).filter(([k])=>k.startsWith("attachment_")))));console.log("GENERATED_SNAPSHOT_CHECKS",JSON.stringify(x.tables["public.direct_messages"].checkConstraints));}'
          if [[ -n "$(git status --porcelain -- apps/api/drizzle)" ]]; then
            echo 'Drizzle schema changed without committed migration artifacts' >&2
            git status --short -- apps/api/drizzle
            exit 1
          fi
