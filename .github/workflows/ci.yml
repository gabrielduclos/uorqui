name: Application checks
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/ci.yml"
jobs:
  api-build-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck -w @uorqui/api
      - name: Build API
        run: npm run build -w @uorqui/api
      - name: Typecheck web
        run: npm run typecheck -w @uorqui/web
      - name: Test image compression fallbacks and cancellation
        run: npm run test:image -w @uorqui/web
      - name: Test unread email and community-avatar regressions
        run: npm run test:notifications -w @uorqui/web
      - name: Test 429 rate-limit backoff
        run: npm run test:rate-limit -w @uorqui/web
      - name: Verify signed visitor IP and secure 429 attribution
        run: npm run test:visitor-ip -w @uorqui/web
      - name: Test serialized bootstrap and public probe caching
        run: npm run test:bootstrap -w @uorqui/web
      - name: Test deduplicated account lookups and session metrics
        run: npm run test:account-probe -w @uorqui/web
      - name: Test restricted-channel invite flow and General default scroll
        run: npm run test:restricted-invites -w @uorqui/web
      - name: Test reusable meeting links and one-hour countdown
        run: npm run test:meeting -w @uorqui/web
      - name: Test server-side meeting expiry and admission guards
        run: node --test apps/api/test/meeting-one-hour.test.mjs
      - name: Test one-use channel invite authorization and migration shape
        run: node --test apps/api/test/restricted-channel-invites.test.mjs
      - name: Test backend unread mail notification synchronization
        run: node --test apps/api/test/mail-unread-notifications.test.mjs
      - name: Build web
        run: npm run build -w @uorqui/web
      - name: Test Resend provider diagnostics without external email
        run: node --test apps/api/test/email-provider.test.mjs
      - name: Verify controlled domain migration origins
        run: node --test apps/api/test/web-origins.test.mjs
      - name: Verify strict shared write-origin guard
        run: node --test apps/api/test/request-origin.test.mjs
      - name: Check Drizzle migration files for schema drift
        shell: bash
        run: |
          npm run db:generate
          if [[ -n "$(git status --porcelain -- apps/api/drizzle)" ]]; then
            echo 'Drizzle schema changed without committed migration artifacts' >&2
            git status --short -- apps/api/drizzle
            exit 1
          fi
