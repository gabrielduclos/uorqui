name: API checks
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - ".github/workflows/ci.yml"
jobs:
  api-build-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck API
        run: npm run typecheck -w @uorqui/api
      - name: Build API
        run: npm run build -w @uorqui/api
      - name: Test Resend provider diagnostics without external email
        run: node --test apps/api/test/email-provider.test.mjs
      - name: Check Drizzle migration files for schema drift
        shell: bash
        run: |
          npm run db:generate
          if [[ -n "$(git status --porcelain -- apps/api/drizzle)" ]]; then
            echo 'Drizzle schema changed without committed migration artifacts' >&2
            git status --short -- apps/api/drizzle
            for file in apps/api/drizzle/0012*.sql; do
              if [[ -f "$file" ]]; then
                echo '--- Generated migration SQL diagnostics ---'
                cat "$file"
              fi
            done
            exit 1
          fi
