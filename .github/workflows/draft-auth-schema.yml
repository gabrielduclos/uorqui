name: Draft auth Drizzle migration (one-time)
on:
  push:
    paths:
      - 'apps/api/src/db/auth-schema.ts'
      - 'apps/api/drizzle.config.ts'
      - '.github/workflows/draft-auth-schema.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate Drizzle migration (no database connection)
        run: npm run db:generate
      - name: Print new migration and metadata for versioning
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/api/drizzle/0001_*.sql apps/api/drizzle/meta/0001_snapshot.json apps/api/drizzle/meta/_journal.json)
          if (( ${#files[@]} != 3 )); then
            echo 'Expected one SQL migration, a snapshot and a journal' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "DBFILE_START:${file}"
            base64 -w0 "${file}"
            echo
            echo "DBFILE_END:${file}"
          done
