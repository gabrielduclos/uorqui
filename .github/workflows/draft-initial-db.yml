name: Draft initial Drizzle migration (one-time)
on:
  push:
    paths:
      - 'apps/api/drizzle.config.ts'
      - '.github/workflows/draft-initial-db.yml'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate (no database connection)
        run: npm run db:generate
      - name: Print generated migration artifacts (base64)
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/api/drizzle/*.sql apps/api/drizzle/meta/*.json)
          if (( ${#files[@]} < 3 )); then
            echo "No complete migration generated" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "DBFILE_START:${file}"
            base64 -w0 "${file}"
            echo
            echo "DBFILE_END:${file}"
          done
