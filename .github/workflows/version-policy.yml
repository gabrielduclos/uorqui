name: Version policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  version-consistency:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for base comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a new version for every PR after beta baseline
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: node scripts/check-release-version.mjs
