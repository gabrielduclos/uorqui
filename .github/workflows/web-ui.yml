name: Web UI (shadcn / React)
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/web-ui.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/web-ui.yml'
permissions:
  contents: read
jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --include=dev --no-audit --no-fund
      - name: Test first-and-last name presentation
        run: npm run test:names -w @uorqui/web
      - name: Test active instance identity and reload handover
        run: npm run test:instance -w @uorqui/web
      - name: Test community channel opening and scroll control
        run: npm run test:channel-scroll -w @uorqui/web
      - name: Test absence of unread summary cards in channel navigation
        run: npm run test:channel-unread-card -w @uorqui/web
      - name: Test channel navigation theme and CSS precedence
        run: npm run test:channel-theme -w @uorqui/web
      - name: Test community channel ordering controls
        run: npm run test:channel-order -w @uorqui/web
      - name: Test inline community mentions
        run: npm run test:community-mentions -w @uorqui/web
      - name: Test channel history date separators and filters
        run: npm run test:channel-history -w @uorqui/web
      - name: Test open-email move actions
        run: npm run test:mail-reader-actions -w @uorqui/web
      - name: Test message timestamps across local midnight
        run: npm run test:message-time -w @uorqui/web
      - name: Type-check and build React application
        run: npm run build -w @uorqui/web
      - name: Validate Cloudflare Worker configuration
        run: npm run check:worker -w @uorqui/web
