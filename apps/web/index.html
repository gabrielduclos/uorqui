<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080e1b" />
    <meta name="description" content="Uorqui — uma plataforma social aberta para pessoas e comunidades." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Uorqui" />
    <title>Uorqui — Conecte-se</title>
    <script>
      // Register on EVERY visit, including before login. This replaces the
      // previous Uorqui Chat worker in installed PWAs on the same hostname.
      // Never reload the page on controllerchange: iOS can get into a loop.
      if ('serviceWorker' in navigator && window.isSecureContext) {
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
          .catch(() => { /* The site remains usable without push/offline features. */ });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
